version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Skip releases younger than a few days to dodge compromised versions
    # that get yanked shortly after publishing.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
