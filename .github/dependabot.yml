version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a few days to dodge compromised versions
    # that get yanked shortly after publishing.
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
