<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Placeholder text made from real recruitment messages received by e-mail and LinkedIn. Typos included."
    />
    <meta name="theme-color" content="#edeff8" />
    <script>
      // Apply the theme before the first paint, see src/composables/useTheme.js
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("recruitment-ipsum:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#12132a" : "#edeff8");
      })();
    </script>
    <meta property="og:title" content="Recruitment Ipsum" />
    <meta
      property="og:description"
      content="It's like Lorem Ipsum, but written by real recruiters."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Recruitment Ipsum – Lorem Ipsum, written by recruiters</title>
  </head>
  <body>
    <noscript>Recruitment Ipsum needs JavaScript to generate text.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
